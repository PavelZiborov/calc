<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Heaven Calc Pro</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=52">
</head>
<body>

<header class="app-top-bar" id="app-top-bar">
    <div class="app-brandbar">
        <div class="app-brand">
            <span class="app-brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2"/><path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4"/><path d="M7 13m0 2a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2z"/></svg></span>
            <span class="app-brand-name">PrintPro <b>Precision</b></span>
        </div>
        <button type="button" class="nav-menu-toggle" id="navMenuToggle" onclick="toggleNavMenu()" aria-label="Разделы" aria-expanded="false" aria-controls="tabsNav">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l16 0"/><path d="M4 12l16 0"/><path d="M4 18l16 0"/></svg>
            <span class="nav-menu-toggle-label">Разделы</span>
        </button>
        <nav class="tabs-nav" id="tabsNav" aria-label="Разделы">
            <button class="nav-tab tab-btn active" data-tab-target="main-tab" onclick="switchTab('main-tab')"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h4"/></svg><span>Калькулятор</span></button>
            <button class="nav-tab tab-btn gated-nav" id="adv-tab-btn" data-tab-target="search-tab" onclick="openOrdersView('list', this)" style="display:none;"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l11 0"/><path d="M9 12l11 0"/><path d="M9 18l11 0"/><path d="M5 6l0 .01"/><path d="M5 12l0 .01"/><path d="M5 18l0 .01"/></svg><span>Заказы</span></button>
            <button class="nav-tab tab-btn gated-nav" id="kanban-nav-btn" data-tab-target="search-tab" onclick="openOrdersView('kanban', this)" style="display:none;"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l6 0"/><path d="M14 4l6 0"/><path d="M4 10a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -8"/><path d="M14 10a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/></svg><span>Канбан</span></button>
            <button class="nav-tab tab-btn gated-nav" id="clients-nav-btn" data-tab-target="clients-tab" onclick="openClientsView(this)" style="display:none;"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/></svg><span>Клиенты</span></button>
            <button class="nav-tab tab-btn gated-nav" id="db-orders-nav-btn" data-tab-target="db-orders-tab" onclick="openDbOrders(this)" style="display:none;"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l6 0"/><path d="M14 4l6 0"/><path d="M4 10a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -8"/><path d="M14 10a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/></svg><span>Заказы БД</span></button>
        </nav>
        <div class="app-brand-actions">
            <button type="button" class="nav-newquote-btn" disabled title="Раздел в разработке" aria-label="Новый расчёт (скоро)"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg><span>New Quote</span></button>
            <button type="button" class="app-user-btn" id="authBtn" onclick="toggleAuthModal()" title="Аккаунт" aria-label="Аккаунт" aria-haspopup="dialog">
                <svg class="app-user-btn-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.87 0-7 2.13-7 4.75V20h14v-1.25C19 16.13 15.87 14 12 14z"/></svg>
            </button>
        </div>
    </div>
</header>

<div id="auth-modal" onmousedown="overlayDown(event)" onclick="if (overlayClickedSelf(event)) toggleAuthModal()">
    <div class="container auth-box" onclick="event.stopPropagation()">
        <span class="auth-modal-close" onclick="toggleAuthModal()" aria-label="Закрыть">&times;</span>

        <div id="auth-logged-in-panel" class="auth-panel" hidden>
            <h3 class="auth-panel-title">Аккаунт</h3>
            <div class="auth-user-card">
                <span id="role-badge" class="auth-role-badge">ГОСТЬ</span>
                <div id="user-display-name" class="auth-user-name">Режим просмотра</div>
            </div>
            <button type="button" id="calcSettingsBtn" class="auth-settings-btn gated-nav" style="display:none;" onclick="openCalcSettings()"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg>Настройки калькулятора</button>
            <button type="button" id="logoutBtn" class="auth-logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div id="auth-login-panel" class="auth-panel">
            <h3 class="auth-panel-title">Авторизация</h3>
            <form onsubmit="attemptLogin(event)">
                <input type="text" id="loginEmail" name="username" placeholder="Ваш ID компании" autocomplete="username">
                <input type="password" id="loginPass" name="password" placeholder="Пароль (Ваш телефон)" style="margin-top:12px;" autocomplete="current-password">
                <button type="submit" id="loginSubmitBtn">Войти в систему</button>
            </form>
            <div id="login-error" class="auth-login-error"></div>
        </div>
    </div>
</div>

<div id="main-tab" class="tab-content active">
    <div class="container" id="calcContainer">
        <div style="position: absolute; left: -9999px; top: -9999px;">
            <input type="text" id="honey_field" name="user_website_url" tabindex="-1" autocomplete="off">
        </div>
        <div class="calc-grid">
        <div class="calc-form-col">
        <div class="calc-form-head">
            <h2>Калькулятор полиграфии</h2>
            <span class="calc-version-badge" title="Версия расчётного модуля">v2.4 Precision</span>
        </div>
        <div class="calc-body">
        <div class="calc-fields">
        <label>Тип продукции</label>
        <select id="type" onchange="updateType()">
            <option value="sheet">Листовая продукция</option>
            <option value="catalog">Каталог / презентация</option>
        </select>

        <div class="row">
            <div class="col">
                <label>Изделие</label>
                <select id="product" onchange="handleProductChange()"></select>
            </div>
            <div class="col">
                <label>Формат изделия</label>
                <select id="format" onchange="setFormat()"></select>
            </div>
        </div>

        <div id="catalogFields" style="display:none">
            <label>Количество полос</label>
            <input id="pages" type="number" inputmode="numeric" value="12" onchange="validatePages()">
            <label>Скрепление</label>
            <select id="binding">
                <option value="staple">Скоба (30 ₽/шт)</option>
                <option value="spring">Пружина (50 ₽/шт)</option>
            </select>
        </div>

        <div class="row">
            <div class="col"><label>Ширина (мм)</label><input id="width" value="210" type="number" inputmode="numeric" oninput="customFormat()"></div>
            <div class="col"><label>Высота (мм)</label><input id="height" value="297" type="number" inputmode="numeric" oninput="customFormat()"></div>
        </div>

        <div class="row">
            <div class="col"><label>Тираж (шт)</label><input id="tirazh" value="100" type="number" inputmode="numeric"></div>
            <div class="col" id="layoutContainer"><label>Изделий на SRA3</label><input id="layout" inputmode="numeric" readonly style="background:#eee;"></div>
        </div>

        <div id="sheetBlock">
            <div class="row">
                <div class="col"><label>Бумага</label><select id="paper"></select></div>
                <div class="col"><label>Цветность</label><select id="colorSheet"></select></div>
            </div>
            <label>Ламинация</label><select id="lamSheet"></select>
        </div>

        <div id="catalogPaper" style="display:none">
            <div class="row">
                <div class="col">
                    <div class="section-title">Обложка</div>
                    <label>Бумага</label><select id="paperCover"></select>
                    <label>Цветность</label><select id="colorCover"></select>
                    <label>Ламинация</label><select id="lamCover"></select>
                </div>
                <div class="col">
                    <div class="section-title">Блок</div>
                    <label>Бумага</label><select id="paperBlock"></select>
                    <label>Цветность</label><select id="colorBlock"></select>
                </div>
            </div>
        </div>

        <div class="checkbox-group" id="processOptions">
            <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
                <div id="simpleCutGroup"><label style="display:flex; align-items:center; cursor:pointer; font-weight:normal; margin-top:0;"><input type="checkbox" id="cut" checked onchange="calcLayout()" style="width:auto; margin-right:10px;"> Резка</label></div>
                <div id="roundingContainer" style="display:flex; align-items:center;"><input type="checkbox" id="rounding" style="width:auto; margin-right:10px;"><label style="margin-top:0; font-weight:normal;">Скругление углов</label></div>
            </div>
            <div id="stickerCutGroup" style="display:none;">
                <label>Метод резки</label>
                <select id="cutMethod" onchange="calcLayout()">
                    <option value="plotter">Плоттерная резка (25 ₽/лист)</option>
                    <option value="straight">Гильотинная резка (+10%)</option>
                </select>
            </div>
        </div>
        </div><!-- /calc-fields -->

        <aside class="calc-preview" aria-hidden="true">
            <div class="calc-preview-head">
                <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21v-16a2 2 0 0 1 2 -2h6l6 6v12"/><path d="M13 3v6h6"/></svg>
                <span>Превью</span>
            </div>
            <div class="calc-preview-stage">
                <div class="calc-preview-diagram">
                    <div class="calc-preview-dim-w"><span id="previewWidthLabel">90 мм</span></div>
                    <div class="calc-preview-dim-h"><span id="previewHeightLabel">50 мм</span></div>
                    <div class="calc-preview-rect" id="previewRect">
                        <svg class="calc-preview-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8h.01"/><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z"/><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/></svg>
                    </div>
                </div>
            </div>
            <p class="calc-preview-caption">Схематичное отображение пропорций</p>
        </aside>
        </div><!-- /calc-body -->

        <button onclick="calc()">РАССЧИТАТЬ СТОИМОСТЬ</button>
        </div><!-- /calc-form-col -->

        <aside class="calc-side-col">
        <div id="resultMain" class="result-main">
            <div class="rec-price-box">
                <button type="button" class="rec-price-gear" id="recPriceGear" onclick="toggleInlinePriceEdit(event)" title="Редактировать цену" aria-label="Редактировать цену" style="display:none;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></svg></button>
                <div class="rec-price-head">
                    <span class="rec-price-label" id="recMultiplierLabel">Рекомендованная цена</span>
                </div>
                <span class="rec-price-val" id="recPriceVal">0 ₽</span>
                <div class="rec-price-edit" id="recPriceEdit" hidden>
                    <label class="rec-edit-field"><span>Общая, ₽</span><input type="number" id="editTotal" step="0.01" min="0" inputmode="decimal" onchange="applyManualTotal()"></label>
                    <label class="rec-edit-field"><span>За штуку, ₽</span><input type="number" id="editPerOne" step="0.01" min="0" inputmode="decimal" onchange="applyManualPerOne()"></label>
                </div>
                <div class="rec-price-stubs">
                    <div class="rec-markup-row" id="markupCoefRow" style="display:none;">
                        <span class="rec-stub-label">Наценка</span>
                        <div class="rec-coef-btns" id="markupCoefBtns"></div>
                    </div>
                    <div class="rec-markup-row" id="recRoundRow" style="display:none;">
                        <span class="rec-stub-label">Округлить</span>
                        <div class="rec-round-btns">
                            <button type="button" onclick="roundSelectedPrice(0)">до ₽</button>
                            <button type="button" onclick="roundSelectedPrice(2)">до коп.</button>
                        </div>
                    </div>
                    <button type="button" class="rec-order-stub" id="addToSheetBtn" onclick="addCurrentCalcToSheet()" title="Добавить этот расчёт в расчётный лист">
                        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg>
                        Добавить в расчёт
                    </button>
                </div>
            </div>
            <div id="costDetail" class="cost-detail"></div>
        </div>
        <div id="techData" class="tech-info" style="display:none;"><span id="techContent"></span></div>
        </aside><!-- /calc-side-col -->
        </div><!-- /calc-grid -->
    </div>

    <div class="container" id="crm-search-container" style="display:none;">
        <label>Поиск заказов</label>
        <div class="advanced-search-row">
            <input type="text" id="crmSearchInput" placeholder="">
            <button onclick="searchCRM('main')" style="background:#27ae60;" title="Найти" aria-label="Найти"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg></button>
            <button onclick="clearMainSearch()" style="background:#2f7df6;" title="Очистить поиск" aria-label="Очистить поиск"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg></button>
        </div>
        <div id="crmLoader" class="loader">Синхронизация с сервером...</div>
        <div id="crmResults"></div>
    </div>
</div>

<div id="search-tab" class="tab-content">
    <div class="container" id="adv-search-container">
        <div class="adv-search-header">
            <div class="adv-toolbar-line">
                <div class="adv-search-input-wrap">
                    <input type="text" id="advSearchInput" class="adv-search-input" placeholder="Поиск…" oninput="updateAdvSearchClearBtn()">
                    <button type="button" class="adv-search-clear-btn" id="advSearchClearBtn" onpointerdown="event.preventDefault()" onclick="clearAdvSearchText()" title="Очистить поле поиска" aria-label="Очистить поле поиска" hidden><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
                </div>
                <button type="button" class="adv-toolbar-icon-btn adv-search-submit" onclick="searchCRM('adv')" title="Найти" aria-label="Найти"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg></button>
                <div class="adv-toolbar-actions">
                    <div class="adv-filters-popover-wrap" id="advFiltersPopoverWrap">
                        <button type="button" class="adv-toolbar-icon-btn adv-filters-btn" id="advFiltersBtn" onclick="toggleAdvFiltersPopover(event)" title="Фильтры" aria-label="Фильтры" aria-expanded="false"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227"/></svg></button>
                        <div class="adv-filters-popover" id="advFiltersPopover" onclick="onAdvFiltersPopoverClick(event)">
                            <div class="adv-filters-popover-section">
                                <label class="adv-filter-label" onclick="closeAdvFilterDropdowns()">Статус</label>
                                <div class="status-dropdown" id="advStatusDropdown">
                                    <button type="button" class="status-dropdown-btn" onclick="toggleStatusDropdown()"></button>
                                    <div class="status-dropdown-list" id="advStatusList"></div>
                                </div>
                            </div>
                            <div class="adv-filters-popover-section">
                                <label class="adv-filter-label" onclick="closeAdvFilterDropdowns()">Период</label>
                                <div class="date-range-dropdown" id="advDateDropdown">
                                    <button type="button" class="date-range-btn" onclick="toggleDateDropdown()"></button>
                                    <div class="date-range-panel" onclick="event.stopPropagation()">
                                        <input type="hidden" id="advDateFrom">
                                        <input type="hidden" id="advDateTo">
                                        <div class="calendar-header">
                                            <button type="button" class="calendar-nav" onclick="changeCalendarMonth(-1)">‹</button>
                                            <div class="calendar-title-wrap">
                                                <select class="calendar-month-select" id="calendarMonthSelect" onchange="changeCalendarMonthSelect(this.value)"></select>
                                                <select class="calendar-year-select" id="calendarYearSelect" onchange="changeCalendarYear(this.value)"></select>
                                            </div>
                                            <button type="button" class="calendar-nav" onclick="changeCalendarMonth(1)">›</button>
                                        </div>
                                        <div class="calendar-weekdays">
                                            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                                        </div>
                                        <div class="calendar-grid" id="calendarGrid"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="adv-filters-popover-section">
                                <label class="adv-filter-label" onclick="closeAdvFilterDropdowns()">Менеджер</label>
                                <div class="status-dropdown" id="advManagerDropdown">
                                    <button type="button" class="status-dropdown-btn" onclick="toggleManagerDropdown()"></button>
                                    <div class="status-dropdown-list" id="advManagerList"></div>
                                </div>
                            </div>
                            <div class="adv-filters-popover-section">
                                <label class="adv-filter-label" onclick="closeAdvFilterDropdowns()">Оплата</label>
                                <label class="adv-pay-filter">
                                    <input type="checkbox" id="advUnpaidOnly" onchange="onAdvUnpaidToggle(event)">
                                    <span>Только неоплаченные</span>
                                </label>
                            </div>
                            <div class="adv-filters-popover-footer">
                                <button type="button" class="adv-filters-apply-btn" onclick="applyAdvFilters(event)" title="Применить фильтры и найти">Применить</button>
                                <button type="button" class="adv-filters-reset-btn" onclick="clearAdvFilters()" title="Сбросить фильтры">Сбросить</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="adv-toolbar-icon-btn clear-filters-btn" onclick="clearAdvFilters()" title="Сбросить фильтры" aria-label="Сбросить фильтры"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg></button>
                    <button type="button" class="adv-toolbar-icon-btn kanban-zoom-btn" id="kanbanZoomBtn" onclick="toggleKanbanZoom()" title="Обзор доски (60%)" aria-label="Масштаб доски"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l4 0l0 -4"/><path d="M3 3l6 6"/><path d="M5 15l4 0l0 4"/><path d="M3 21l6 -6"/><path d="M19 9l-4 0l0 -4"/><path d="M21 3l-6 6"/><path d="M19 15l-4 0l0 4"/><path d="M21 21l-6 -6"/></svg></button>
                </div>
            </div>
        </div>
        <div id="advCrmLoader" class="loader">Поиск по архиву...</div>
        <div id="advCrmResults" class="readonly-mode"></div>
    </div>
</div>

<div id="clients-tab" class="tab-content">
    <div class="container" id="clients-container">
        <div class="clients-header">
            <h2 class="clients-title">Клиенты</h2>
            <div class="clients-toolbar">
                <input type="text" id="clientsSearchInput" class="clients-search" placeholder="Поиск клиентов…" oninput="onClientsSearchInput(this.value)">
                <button type="button" class="clients-btn clients-btn-add" onclick="toggleClientForm()">＋ Добавить клиента</button>
                <button type="button" class="clients-btn clients-btn-sync" onclick="syncClientsFromCrm(this)" title="Загрузить клиентов из CRM в свою базу">⟳ Синхронизировать из CRM</button>
            </div>
        </div>
        <div id="clientAddForm" class="clients-form" style="display:none;">
            <div class="clients-form-grid">
                <label>Компания / имя<input type="text" id="clientCompany" placeholder="ООО Ромашка"></label>
                <label>Контактное лицо<input type="text" id="clientContact" placeholder="Иван Иванов"></label>
                <label>Телефон<input type="text" id="clientPhone" placeholder="+7 999 000-00-00"></label>
                <label>Email<input type="text" id="clientEmail" placeholder="mail@example.com"></label>
                <label class="clients-form-wide">Заметки<input type="text" id="clientNotes" placeholder="Комментарий"></label>
            </div>
            <div class="clients-form-actions">
                <button type="button" class="clients-btn clients-btn-add" onclick="submitNewClient(this)">Сохранить (в БД и CRM)</button>
                <button type="button" class="clients-btn clients-btn-cancel" onclick="toggleClientForm(false)">Отмена</button>
            </div>
        </div>
        <div id="clientsResults"></div>
    </div>
</div>

<div id="db-orders-tab" class="tab-content">
    <div class="container" id="db-orders-container">
        <div class="adv-search-header">
            <div class="adv-toolbar-line">
                <div class="dbk-viewtoggle" role="group" aria-label="Вид">
                    <button type="button" id="dbViewListBtn" class="dbk-view-btn" onclick="setDbView('list')">Список</button>
                    <button type="button" id="dbViewKanbanBtn" class="dbk-view-btn" onclick="setDbView('kanban')">Канбан</button>
                </div>
                <div class="adv-search-input-wrap">
                    <input type="text" id="dbkSearchInput" class="adv-search-input" placeholder="Поиск…" oninput="onDbDealsSearchInput(this.value)">
                    <button type="button" class="adv-search-clear-btn" id="dbkSearchClearBtn" onpointerdown="event.preventDefault()" onclick="clearDbSearch()" title="Очистить поле поиска" aria-label="Очистить поле поиска" hidden><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
                </div>
                <button type="button" class="adv-toolbar-icon-btn adv-search-submit" onclick="loadDbDeals()" title="Найти" aria-label="Найти"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg></button>
                <div class="adv-toolbar-actions">
                    <div class="adv-filters-popover-wrap" id="dbFiltersWrap">
                        <button type="button" class="adv-toolbar-icon-btn adv-filters-btn" id="dbFiltersBtn" onclick="toggleDbFilters(event)" title="Фильтры" aria-label="Фильтры" aria-expanded="false"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227"/></svg></button>
                        <div class="adv-filters-popover" id="dbFiltersPopover">
                            <div class="adv-filters-popover-section">
                                <label class="adv-filter-label">Статус</label>
                                <div id="dbFilterStatusList" class="dbk-filter-statuses"></div>
                            </div>
                            <div class="adv-filters-popover-section">
                                <label class="adv-pay-filter"><input type="checkbox" id="dbFilterDebtOnly" onchange="applyDbFilters()"><span>Только с долгом</span></label>
                            </div>
                            <div class="adv-filters-popover-actions">
                                <button type="button" class="adv-filters-reset-btn" onclick="resetDbFilters()">Сбросить</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="adv-toolbar-icon-btn" onclick="resetDbFilters()" title="Сбросить все фильтры" aria-label="Сбросить все фильтры"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg></button>
                    <button type="button" class="dbk-btn dbk-btn-sync" onclick="syncDbDeals(this)" title="Загрузить сделки из CRM в свою базу">⟳ Сделки</button>
                    <button type="button" class="dbk-btn dbk-btn-sync" onclick="syncDbElements(this)" title="Загрузить элементы всех сделок (может занять время)">⟳ Элементы</button>
                </div>
            </div>
        </div>
        <div id="dbOrdersBody"></div>
    </div>
</div>
